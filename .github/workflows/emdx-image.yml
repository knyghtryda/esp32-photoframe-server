name: EMDX image

# Builds this fork's deploy branch (upstream plus the "rgb" display type) into
# ghcr.io/<owner>/esp32-photoframe-server:emdx for the Portainer stack that
# runs the Samsung EMDX bridge. Not for upstream: once "rgb" ships in a
# release, the stack switches to aitjcize/esp32-photoframe-server and this
# branch goes away.

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/esp32-photoframe-server

jobs:
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.VERSION }}
      converter: ${{ steps.resolve.outputs.CONVERTER_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve
        id: resolve
        # VERSION shows in /api/status and the webapp footer (e.g.
        # v1.17.3-1-g71619ee). CONVERTER_VERSION is resolved once for both
        # architectures and busts the converter install layer's cache when a
        # new release ships (see Dockerfile).
        run: |
          echo "VERSION=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          echo "CONVERTER_VERSION=$(npm view @aitjcize/epaper-image-convert version)" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.arch }})
    # Native runners for each arch: building the canvas module under QEMU
    # takes an hour+ and can hang (see ci.yml)
    runs-on: ${{ matrix.runner }}
    needs: versions
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.versions.outputs.version }}
            CONVERTER_VERSION=${{ needs.versions.outputs.converter }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=emdx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=emdx-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch tags
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=emdx
            type=sha

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
